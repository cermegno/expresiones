<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Expresiones en Español</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --correct-bg: #d1fae5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 600px;
            padding: 28px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #111827;
        }

        .expression-card {
            background-color: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .expression-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1d4ed8;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .option-label:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }

        /* Post-submission styles */
        .option-label.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-label.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-text);
        }

        .examples-box {
            background-color: #f8fafc;
            border-left: 4px solid var(--primary-color);
            border-radius: 0 8px 8px 0;
            padding: 16px;
            margin-bottom: 24px;
        }

        .examples-title {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 8px;
        }

        .examples-list {
            list-style-type: disc;
            padding-left: 20px;
            font-style: italic;
            color: #334155;
            font-size: 0.95rem;
        }

        .examples-list li {
            margin-bottom: 4px;
        }

        .feedback-message {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .feedback-message.correct {
            color: var(--correct-border);
        }

        .feedback-message.incorrect {
            color: var(--incorrect-border);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }

        .hidden {
            display: none !important;
        }

        .exit-screen {
            text-align: center;
            padding: 20px 0;
        }

        .exit-screen h2 {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h1>Quiz de Expresiones en Español</h1>

        <div id="quiz-screen">
            <div class="expression-card">
                <div class="expression-title" id="expression-text">--</div>
            </div>

            <div class="options-container" id="options-container">
                </div>

            <div class="examples-box">
                <div class="examples-title">Ejemplos de uso</div>
                <ul class="examples-list" id="examples-list">
                    </ul>
            </div>

            <div class="feedback-message" id="feedback"></div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="btn-submit" onclick="submitAnswer()">Enviar</button>
                <button class="btn btn-primary hidden" id="btn-next" onclick="loadNextQuestion()">Siguiente</button>
                <button class="btn btn-secondary hidden" id="btn-exit-active" onclick="exitApp()">Salir</button>
            </div>
        </div>

        <div id="exit-screen" class="exit-screen hidden">
            <h2>¡Gracias por practicar!</h2>
            <p style="margin-bottom: 20px; color: #4b5563;">Has completado tu sesión de estudio.</p>
            <button class="btn btn-primary" onclick="restartQuiz()">Reiniciar Quiz</button>
        </div>
    </div>

    <script>
        const expressions = [
          { "id": "exp_001", "expression": "Tomar el pelo", "meaning": "Bromear o engañar a alguien de forma simpática o burlona.", "distractors": ["Cortar o peinar el cabello a una persona.", "Estar muy enfadado o perder la paciencia con alguien."], "examples": ["No me digas que me ha tocado la lotería, ¡me estás tomando el pelo!", "A Juan le gusta tomarle el pelo a su hermano diciendo que los ovnis existen."] },
          { "id": "exp_002", "expression": "Arrimar el hombro", "meaning": "Colaborar o ayudar de manera activa en una tarea común.", "distractors": ["Empujar a alguien para abrirse paso en una multitud.", "Descansar recostándose sobre otra persona."], "examples": ["Si todos arrimamos el hombro, terminaremos la mudanza en un par de horas.", "En los momentos difíciles es cuando el equipo tiene que arrimar el hombro."] },
          { "id": "exp_003", "expression": "Meter la pata", "meaning": "Cometer un error o decir algo inoportuno.", "distractors": ["Pisar a alguien sin querer al caminar.", "Sufrir una lesión leve en el pie."], "examples": ["Creo que metí la pata al preguntarle por su exnovio.", "Metiste la pata al contarle el secreto a María."] },
          { "id": "exp_004", "expression": "Tirar la casa por la ventana", "meaning": "Gastar mucho dinero o derrochar en una celebración.", "distractors": ["Hacer limpieza profunda tirando objetos viejos.", "Mudarse de vivienda de forma apresurada."], "examples": ["En la boda de su hija tiraron la casa por la ventana.", "Para mi cumpleaños pienso tirar la casa por la ventana y alquilar un yate."] },
          { "id": "exp_005", "expression": "Costar un ojo de la cara", "meaning": "Tener un precio excesivamente elevado.", "distractors": ["Mirar fijamente algo hasta que duelen los ojos.", "Padecer un problema médico en la visión."], "examples": ["Ese coche deportivo cuesta un ojo de la cara.", "Reparar el tejado nos va a costar un ojo de la cara."] },
          { "id": "exp_006", "expression": "Dar la lata", "meaning": "Molestar, insistir o ser pesado con algo.", "distractors": ["Entregar un recipiente metálico a alguien.", "Reciclar envases en el contenedor adecuado."], "examples": ["Mi hermano pequeño estuvo dando la lata todo el día para ir al parque.", "Siento darte la lata, pero necesito que me firmes este documento."] },
          { "id": "exp_007", "expression": "Irse por las ramas", "meaning": "Desviarse del tema principal al hablar.", "distractors": ["Escalar árboles en la naturaleza.", "Hacer ejercicios de equilibrio en el parque."], "examples": ["Al profesor le gusta irse por las ramas cuando le hacemos preguntas difíciles.", "No te vayas por las ramas y dime de una vez cuánto ha costado."] },
          { "id": "exp_008", "expression": "Hablar por los codos", "meaning": "Hablar demasiado y de forma ininterrumpida.", "distractors": ["Gesticular en exceso al expresarse.", "Hablar en voz muy baja o en secreto."], "examples": ["Tu prima habla por los codos, no me dejó decir ni una palabra.", "Cuando estoy nervioso tiendo a hablar por los codos."] },
          { "id": "exp_009", "expression": "Ser pan comido", "meaning": "Ser algo muy fácil de realizar.", "distractors": ["Tener un apetito insaciable.", "Preparar un bocadillo rápido para comer."], "examples": ["El examen de historia fue pan comido.", "No te preocupes por la instalación del programa, es pan comido."] },
          { "id": "exp_010", "expression": "Estar como una cabra", "meaning": "Estar chiflado, loco o actuar de forma extravagante.", "distractors": ["Tener mucho apetito por cosas vegetales.", "Vivir en zonas de alta montaña."], "examples": ["Ese chico está como una cabra, saltó al agua con la ropa puesta.", "A veces pienso que mi abuelo está como una cabra con sus ocurrencias."] },
          { "id": "exp_011", "expression": "Dar gato por liebre", "meaning": "Engañar a alguien dándole algo de menor calidad de lo prometido.", "distractors": ["Adoptar una mascota equivocada en el refugio.", "Preparar una receta con ingredientes sustitutivos."], "examples": ["En la tienda me dieron gato por liebre con esta chaqueta sintética.", "Asegúrate de revisar el producto antes de pagar para que no te den gato por liebre."] },
          { "id": "exp_012", "expression": "Quedarse de piedra", "meaning": "Quedarse muy sorprendido o impactado ante una noticia.", "distractors": ["Permanecer inmóvil sin poder moverse por frío.", "Sufrir una parálisis temporal por cansancio."], "examples": ["Me quedé de piedra cuando supe que cerraban la empresa.", "Al ver el regalo de aniversario se quedó de piedra."] },
          { "id": "exp_013", "expression": "Dormir a pierna suelta", "meaning": "Dormir profundamente y de forma muy relajada.", "distractors": ["Dormir sin mantas ni ropa de cama.", "Tener calambres en las piernas mientras se duerme."], "examples": ["Después de la excursión dormí a pierna suelta toda la noche.", "A pesar del ruido de la calle, ella duerme a pierna suelta."] },
          { "id": "exp_014", "expression": "Poner la mano en el fuego", "meaning": "Confiar ciegamente en la honestidad o inocencia de alguien.", "distractors": ["Sufrir un accidente al cocinar en casa.", "Arriesgar la salud en una apuesta insensata."], "examples": ["Pondría la mano en el fuego por mi hermano, él no robó nada.", "No pongas la mano en el fuego por él sin conocer toda la historia."] },
          { "id": "exp_015", "expression": "Echar una mano", "meaning": "Ayudar a alguien con alguna tarea o problema.", "distractors": ["Saludar a alguien alzando la extremidad superior.", "Lanzar algo a otra persona para que lo atrape."], "examples": ["¿Puedes echarme una mano con estas bolsas de la compra?", "Siempre está dispuesto a echar una mano a sus vecinos."] },
          { "id": "exp_016", "expression": "Estar sin blanca", "meaning": "No tener nada de dinero.", "distractors": ["Vestir únicamente prendas de color claro.", "Tener la piel pálida por falta de sol."], "examples": ["A finales de mes siempre estoy sin blanca.", "No puedo ir al cine con vosotros porque me he quedado sin blanca."] },
          { "id": "exp_017", "expression": "No pegar ojo", "meaning": "No poder dormir en toda la noche.", "distractors": ["Tener problemas de visión o irritación en los ojos.", "Evitar el contacto visual con otra persona."], "examples": ["Con el ruido del tráfico no he pegado ojo en toda la noche.", "Estaba tan nervioso por la entrevista que no pegué ojo."] },
          { "id": "exp_018", "expression": "Romper el hielo", "meaning": "Superar la timidez inicial en una conversación o grupo.", "distractors": ["Destruir un bloque helado con herramientas.", "Enfriar una bebida con cubitos picados."], "examples": ["El profesor contó un chiste para romper el hielo el primer día.", "Una buena forma de romper el hielo es hacer un cumplido sincero."] },
          { "id": "exp_019", "expression": "Poner las cartas sobre la mesa", "meaning": "Hablar con total claridad y sinceridad sobre las intenciones.", "distractors": ["Organizar un juego de mesa entre amigos.", "Mostrar la documentación requerida en un trámite."], "examples": ["Es hora de poner las cartas sobre la mesa y decidir nuestro futuro.", "Puso las cartas sobre la mesa y admitió sus errores."] },
          { "id": "exp_020", "expression": "Dar en el clavo", "meaning": "Acertar plenamente en una deducción o solución.", "distractors": ["Herirse los dedos al usar un martillo.", "Colgar un cuadro correctamente en la pared."], "examples": ["Has dado en el clavo con tu análisis del problema.", "Con la respuesta que dio en el concurso dio de lleno en el clavo."] },
          { "id": "exp_021", "expression": "Quitarse un peso de encima", "meaning": "Liberarse de una preocupación o responsabilidad grande.", "distractors": ["Perder peso tras hacer dieta y ejercicio.", "Descargar cajas pesadas de un vehículo."], "examples": ["Cuando entregué el proyecto final me quité un gran peso de encima.", "Hablar con él sobre el malentendido me quitó un peso de encima."] },
          { "id": "exp_022", "expression": "Estar entre la espada y la pared", "meaning": "Encontrarse en una situación de difícil elección sin salida.", "distractors": ["Participar en un combate de esgrima.", "Sentirse acorralado físicamente en un espacio estrecho."], "examples": ["Me siento entre la espada y la pared: si voy a la fiesta enfado a mi madre y si no voy enfado a mi amigo.", "La empresa está entre la espada y la pared por la crisis."] },
          { "id": "exp_023", "expression": "Estar como pez en el agua", "meaning": "Sentirse muy cómodo e integrado en un lugar o situación.", "distractors": ["Tener mucha sed después de hacer ejercicio.", "Saber nadar con excelente técnica en el mar."], "examples": ["En la conferencia de informática se sentía como pez en el agua.", "A ella le encanta el teatro y en el escenario está como pez en el agua."] },
          { "id": "exp_024", "expression": "Poner verde a alguien", "meaning": "Criticar duramente o hablar mal de una persona a sus espaldas.", "distractors": ["Manchar a alguien con pintura o sustancias ecológicas.", "Envidiar el éxito o las pertenencias de otra persona."], "examples": ["Estuvieron toda la tarde poniendo verde a su nueva compañera.", "No me gusta cuando se dedican a poner verde a la gente."] },
          { "id": "exp_025", "expression": "Tener mala leche", "meaning": "Tener mal carácter, mal humor o malas intenciones.", "distractors": ["Conservar productos lácteos caducados.", "Padecer intolerancia a la lactosa."], "examples": ["Ese profesor tiene muy mala leche cuando los alumnos llegan tarde.", "No le hagas caso, responde así porque hoy tiene mala leche."] },
          { "id": "exp_026", "expression": "Salir por patas", "meaning": "Huir o escapar corriendo de un lugar rápidamente.", "distractors": ["Caminar a cuatro patas por el suelo.", "Hacer ejercicio de carreras intensas."], "examples": ["Cuando sonó la alarma de la tienda, el ladrón salió por patas.", "Vimos aparecer al perro guardián y salimos por patas."] },
          { "id": "exp_027", "expression": "Ir al grano", "meaning": "Ir directamente a lo importante sin rodeos.", "distractors": ["Ir a una granja o terreno de cultivo de cereales.", "Tratar una afección o grano en la piel."], "examples": ["No tenemos mucho tiempo, así que vamos al grano con la reunión.", "Déjate de historias e ve al grano con lo que pasó."] },
          { "id": "exp_028", "expression": "Pillar con las manos en la masa", "meaning": "Sorprender a alguien en el momento exacto en que comete algo malo.", "distractors": ["Ayudar a alguien mientras prepara pan o repostería.", "Ensuciarse las manos durante un trabajo manual."], "examples": ["Lo pillaron con las manos en la masa intentando copiar en el examen.", "La policía llegó a tiempo y pilló a los ladrones con las manos en la masa."] },
          { "id": "exp_029", "expression": "Dar plantón", "meaning": "No acudir a una cita pactada dejando a la otra persona esperando.", "distractors": ["Sembrar plantas o árboles en un jardín.", "Quedarse inmóvil durante mucho tiempo en un sitio."], "examples": ["Me dio plantón en la cafetería y estuve esperándole una hora.", "No es la primera vez que le da plantón a sus amigos."] },
          { "id": "exp_030", "expression": "Cantar las cuarenta", "meaning": "Reñir o decirle a alguien las verdades claramente.", "distractors": ["Entonar canciones populares o tradicionales.", "Llegar a la edad de cuarenta años."], "examples": ["Le canté las cuarenta por no haber hecho su parte del trabajo.", "Como vuelva a llegar tarde, el jefe le va a cantar las cuarenta."] },
          { "id": "exp_031", "expression": "Quedarse en blanco", "meaning": "Olvidarse repentinamente de lo que se iba a decir o escribir.", "distractors": ["Pintar una pared o lienzo de color blanco.", "Quedarse pálido tras un susto enorme."], "examples": ["Iba a responder la pregunta, pero me quedé totalmente en blanco.", "A la actriz le dio pánico escénico y se quedó en blanco."] },
          { "id": "exp_032", "expression": "Estar al caer", "meaning": "Estar a punto de ocurrir o de llegar de forma inminente.", "distractors": ["Tener riesgo de tropezarse o caerse al suelo.", "Padecer debilidad física o mareo."], "examples": ["El autobús debe de estar al caer, ya son las ocho.", "La respuesta a tu solicitud de empleo está al caer."] },
          { "id": "exp_033", "expression": "Tirar la toalla", "meaning": "Rendirse o abandonar un empeño o proyecto.", "distractors": ["Secarse el cuerpo tras salir de la ducha.", "Lanzar objetos en un centro deportivo."], "examples": ["A pesar de las dificultades, nunca tiró la toalla y aprobó.", "Lleva meses intentándolo y no piensa tirar la toalla ahora."] },
          { "id": "exp_034", "expression": "Ser un cero a la izquierda", "meaning": "No tener ningún valor, importancia o influencia en un grupo.", "distractors": ["Usar números negativos en operaciones matemáticas.", "Ubicarse a la izquierda en una formación militar."], "examples": ["Siento que mis opiniones en las reuniones son un cero a la izquierda.", "No le piden consejo porque para ellos es un cero a la izquierda."] },
          { "id": "exp_035", "expression": "Poner los puntos sobre las i", "meaning": "Aclarar la situación detalladamente y sin dejar dudas.", "distractors": ["Corregir faltas de ortografía en un documento.", "Aprender a escribir caligrafía clásica."], "examples": ["Antes de firmar el contrato, puso los puntos sobre las i.", "Conviene poner los puntos sobre las i para evitar confusiones futuras."] },
          { "id": "exp_037", "expression": "Hacer oídos sordos", "meaning": "Ignorar deliberadamente lo que alguien dice o pide.", "distractors": ["Padecer problemas de audición o sordera.", "Escuchar música a volumen demasiado alto."], "examples": ["Hizo oídos sordos a los consejos de su médico y siguió fumando.", "La dirección hizo oídos sordos a las peticiones del personal."] },
          { "id": "exp_038", "expression": "Consultar con la almohada", "meaning": "Tener que meditar una decisión durante la noche antes de actuar.", "distractors": ["Tener problemas de insomnio o mala postura.", "Comprar accesorios para la cama."], "examples": ["Es una oferta tentadora, pero prefiero consultarlo con la almohada.", "Consúltalo con la almohada y mañana me dices tu respuesta."] },
          { "id": "exp_039", "expression": "Estar hasta en la sopa", "meaning": "Encontrarse a alguien o algo en todas partes de forma repetitiva.", "distractors": ["Comer sopa caliente a diario por dieta.", "Encontrar objetos extraños en la comida."], "examples": ["Ese actor está hasta en la sopa últimamente, sale en todas las películas.", "Las canciones de ese grupo están hasta en la sopa."] },
          { "id": "exp_040", "expression": "Cruzar los dedos", "meaning": "Desear que algo salga bien o tener suerte.", "distractors": ["Sentir dolor en las articulaciones de las manos.", "Entrelazar las manos para hacer estiramientos."], "examples": ["Cruzo los dedos para que consigas el trabajo que quieres.", "Estamos cruzando los dedos para que no llueva durante la boda."] },
          { "id": "exp_041", "expression": "Salirse con la suya", "meaning": "Conseguir lo que se desea a pesar de la oposición o dificultades.", "distractors": ["Abandonar un trayecto para ir por otro camino.", "Hacer las cosas sin pedir permiso a nadie."], "examples": ["Al final se salió con la suya y compró el coche que quería.", "Es muy副es muy insistente y siempre logra salirse con la suya."] },
          { "id": "exp_042", "expression": "Bajar la guardia", "meaning": "Disminuir la atención o precaución ante un peligro potencial.", "distractors": ["Agacharse en un puesto de vigilancia de seguridad.", "Terminar un turno de trabajo nocturno."], "examples": ["No podemos bajar la guardia ante los ciberataques.", "Cuando bajó la guardia, le metieron un gol en el último minuto."] },
          { "id": "exp_043", "expression": "Estar en su salsa", "meaning": "Estar en un entorno o actividad donde uno se desenvuelve a la perfección.", "distractors": ["Cocinar guisos con mucha salsa tradicional.", "Mancharse la ropa durante el almuerzo."], "examples": ["En los debates políticos él está verdaderamente en su salsa.", "Ponle a hablar de música y verás cómo está en su salsa."] },
          { "id": "exp_044", "expression": "Llevar la voz cantante", "meaning": "Tener la iniciativa o el mando en un grupo o conversación.", "distractors": ["Ser el cantante principal en una banda de música.", "Hablar en un tono más elevado que los demás."], "examples": ["En esa negociación fue ella quien llevó la voz cantante.", "Su hermano siempre lleva la voz cantante en las decisiones familiares."] },
          { "id": "exp_045", "expression": "Verlo todo de color de rosa", "meaning": "Ser excesivamente optimista e ingenuo ante las cosas.", "distractors": ["Padecer un trastorno visual de percepción de colores.", "Decorar un espacio con tonos rosados."], "examples": ["Cuando te enamoras tiendes a verlo todo de color de rosa.", "Es bueno ser positivo, pero no puedes verlo todo de color de rosa."] },
          { "id": "exp_046", "expression": "Perder el tren", "meaning": "Desaprovechar una oportunidad única o importante.", "distractors": ["Llegar tarde a la estación de transporte público.", "Confundirse de vagón en un viaje."], "examples": ["Si no aceptas la beca ahora, vas a perder el tren de tu vida.", "Sintió que había perdido el tren al no comprar la casa a tiempo."] },
          { "id": "exp_047", "expression": "Estar en las nubes", "meaning": "Estar distraído, despistado o pensando en otras cosas.", "distractors": ["Viajar en avión a gran altitud.", "Mirar la lluvia a través de la ventana."], "examples": ["Aterriza un poco, que siempre estás en las nubes durante la clase.", "Perdona, no te oí porque estaba en las nubes."] },
          { "id": "exp_048", "expression": "Echar de menos", "meaning": "Sentir la falta o añoranza de una persona o lugar.", "distractors": ["Descartar objetos en una limpieza de casa.", "Llegar tarde a un compromiso pactado."], "examples": ["Echo mucho de menos a mis amigos cuando viajo.", "Se nota que echa de menos vivir en su ciudad natal."] },

          { "id": "exp_150", "expression": "Tener mucho temple", "meaning": "Mantener la calma y serenidad en momentos de gran tensión.", "distractors": ["Ajustar la temperatura de una estancia.", "Poseer fuerza física en las extremidades."], "examples": ["El piloto demostró tener mucho temple durante la maniobra de emergencia.", "Hay que tener mucho temple para hablar en público en esas condiciones."] }
        ];

        let currentItem = null;
        let isSubmitted = false;

        // Shuffle utility
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const newArray = [...array];
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        function loadQuestion() {
            isSubmitted = false;
            
            // Pick random expression
            const randomIndex = Math.floor(Math.random() * expressions.length);
            currentItem = expressions[randomIndex];

            // Render expression header
            document.getElementById('expression-text').textContent = currentItem.expression;

            // Prepare choices
            const choices = shuffle([
                { text: currentItem.meaning, isCorrect: true },
                { text: currentItem.distractors[0], isCorrect: false },
                { text: currentItem.distractors[1], isCorrect: false }
            ]);

            // Render choices
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            choices.forEach((choice, index) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                label.id = `option-label-${index}`;
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'quiz-option';
                radio.value = choice.isCorrect ? 'correct' : 'incorrect';
                radio.id = `opt-${index}`;
                
                const span = document.createElement('span');
                span.textContent = choice.text;

                label.appendChild(radio);
                label.appendChild(span);
                optionsContainer.appendChild(label);
            });

            // Render examples
            const examplesList = document.getElementById('examples-list');
            examplesList.innerHTML = '';
            currentItem.examples.forEach(ex => {
                const li = document.createElement('li');
                li.textContent = ex;
                examplesList.appendChild(li);
            });

            // Reset UI state
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'none';
            feedback.className = 'feedback-message';
            
            document.getElementById('btn-submit').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-exit-active').classList.add('hidden');
        }

        function submitAnswer() {
            const selectedRadio = document.querySelector('input[name="quiz-option"]:checked');
            if (!selectedRadio) {
                alert('Por favor, selecciona una respuesta.');
                return;
            }

            isSubmitted = true;
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            const options = document.querySelectorAll('.option-label');
            options.forEach(label => {
                const radio = label.querySelector('input[type="radio"]');
                radio.disabled = true;

                if (radio.value === 'correct') {
                    label.classList.add('correct');
                } else if (radio.checked) {
                    label.classList.add('incorrect');
                }
            });

            if (selectedRadio.value === 'correct') {
                feedback.textContent = '¡Correcto!';
                feedback.classList.add('correct');
            } else {
                feedback.textContent = 'Incorrecto';
                feedback.classList.add('incorrect');
            }

            // Update action buttons
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-exit-active').classList.remove('hidden');
        }

        function loadNextQuestion() {
            loadQuestion();
        }

        function exitApp() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('exit-screen').classList.remove('hidden');
        }

        function restartQuiz() {
            document.getElementById('exit-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        // Initialize quiz on load
        window.onload = loadQuestion;
    </script>
